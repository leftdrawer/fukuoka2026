<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="googlebot" content="noindex,nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#eef0f5">
<title>후쿠오카 순례</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preload" href="vendor/jua-sub.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="app.css">
<script>
  try { var t = localStorage.getItem('theme'); document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch (e) {}
</script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-locate" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></symbol>
    <symbol id="i-follow" viewBox="0 0 24 24"><path d="M12 3l7 18-7-4-7 4z"/></symbol>
    <symbol id="i-gps" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"/><path d="M16.2 7.8a6 6 0 0 1 0 8.4M7.8 16.2a6 6 0 0 1 0-8.4M19.1 4.9a10 10 0 0 1 0 14.2M4.9 19.1a10 10 0 0 1 0-14.2"/></symbol>
    <symbol id="i-wake" viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.2"/><path d="M11 18h2"/><path d="M3 9v6M21 9v6"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.5 13.2A8.5 8.5 0 1 1 10.8 3.5a6.6 6.6 0 0 0 9.7 9.7z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></symbol>
    <symbol id="i-qr" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="6.5" height="6.5" rx="1"/><rect x="14" y="3.5" width="6.5" height="6.5" rx="1"/><rect x="3.5" y="14" width="6.5" height="6.5" rx="1"/><path d="M14 14h2.5v2.5H14zM20.5 14v6.5M14 20.5h3"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h9"/></symbol>
  </defs>
</svg>

<div id="map" aria-label="지도"></div>
<canvas id="rain" aria-hidden="true"></canvas>
<div id="flash" aria-hidden="true"></div>

<header id="hud">
  <div class="hud-row">
    <div id="chap" class="chap"></div>
    <div class="hud-text">
      <div id="dayTitle"></div>
      <div id="dayMeta"></div>
    </div>
  </div>
  <div class="hud-row2">
    <div id="stamps" class="stamps" aria-label="기도터 도장"></div>
    <div class="xp" aria-hidden="true"><div id="xpFill" class="xp-fill"></div></div>
    <span id="xpText" class="xp-text"></span>
  </div>
</header>

<div id="banner" aria-hidden="true"><span class="b-tag">다음</span><span id="bannerText"></span></div>
<div id="toast" role="status" aria-live="polite"></div>

<div id="fabs">
  <div class="col left">
    <button id="bQR" class="fab" title="입국 QR"><svg class="ic"><use href="#i-qr"/></svg><span class="t">입국 QR</span></button>
    <button id="bWake" class="fab" aria-pressed="false" title="화면 꺼짐 방지"><svg class="ic"><use href="#i-wake"/></svg><span class="t">화면 켜둠</span></button>
    <button id="bTheme" class="fab" title="밤 모드"><svg class="ic"><use id="themeIc" href="#i-moon"/></svg><span class="t">밤 모드</span></button>
  </div>
  <div class="col right">
    <button id="bGpsOff" class="fab" title="GPS 켜기/끄기"><svg class="ic"><use href="#i-gps"/></svg><span class="t">GPS 켜기</span></button>
    <button id="bFollow" class="fab" aria-pressed="false" title="따라가기"><svg class="ic"><use href="#i-follow"/></svg><span class="t">따라가기</span></button>
    <button id="bLocate" class="fab" title="내 위치로 이동"><svg class="ic"><use href="#i-locate"/></svg><canvas id="locOrb" class="ic-orb" aria-hidden="true"></canvas><span class="t">내 위치</span></button>
  </div>
</div>

<section id="quest" aria-label="지금 할 일">
  <div class="q-inner">
    <div id="qStamp" class="slot" aria-hidden="true"></div>
    <canvas id="qOrb" class="orb hide" aria-hidden="true"></canvas>
    <div class="q-top"><span id="qType" class="q-type"></span><span id="qTimer" class="q-timer"></span></div>
    <div id="qTitle" class="q-title"></div>
    <ul id="qObjs" class="q-objs"></ul>
    <div id="qReward" class="q-reward"></div>
    <div id="qDist" class="q-dist"></div>
    <div id="qNext" class="q-next"></div>
    <div class="q-actions">
      <button id="qDetail" class="q-btn">자세히</button>
      <button id="qDone" class="q-btn primary">완료</button>
    </div>
  </div>
</section>

<nav id="dock" role="tablist"></nav>

<div id="scrim"></div>
<section id="sheet" aria-hidden="true">
  <div class="grab"></div>
  <div id="sheetBody"></div>
  <div class="sheetNav">
    <button id="sPrev">이전</button>
    <button id="sClose">닫기</button>
    <button id="sNext">다음</button>
  </div>
</section>

<section id="menu" aria-hidden="true">
  <div class="grab"></div>
  <div class="m-tabs" role="tablist">
    <button data-tab="log" aria-selected="true">일정</button>
    <button data-tab="bag">준비물</button>
    <button data-tab="shop">기념품</button>
    <button data-tab="rule">예절</button>
    <button data-tab="money">예산</button>
    <button data-tab="wx">날씨</button>
  </div>
  <div id="menuBody"></div>
  <div class="sheetNav one"><button id="mClose">닫기</button></div>
</section>

<div id="intro" aria-hidden="true">
  <div class="intro-card">
    <div id="introNum" class="intro-num"></div>
    <div id="introTitle" class="intro-title"></div>
    <div id="introSub" class="intro-sub"></div>
    <div class="intro-slots" id="introSlots"></div>
  </div>
</div>
<div id="punch" aria-hidden="true"><div id="punchMark"></div></div>

<section id="qr" aria-hidden="true" aria-label="입국 QR">
  <div class="qr-top"><b>입국 QR (Visit Japan Web)</b><button id="qrClose" class="qr-x" aria-label="닫기">✕</button></div>
  <div id="qrImgs" class="qr-imgs"></div>
  <p class="qr-hint">화면 밝기를 최대로 올려서 보여 주세요. 캡처는 이 폰에만 저장돼요.</p>
  <div class="qr-actions">
    <label class="qr-btn">QR 캡처 불러오기<input id="qrFile" type="file" accept="image/*" multiple hidden></label>
    <a class="qr-btn primary" href="https://www.vjw.digital.go.jp/main/#/vjwpic026" target="_blank" rel="noopener">Visit Japan Web 열기</a>
    <button id="qrDel" class="qr-btn">저장한 캡처 지우기</button>
  </div>
</section>

<script src="vendor/leaflet.js"></script>
<script src="vendor/orbs.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js'); });
  }
</script>
</body>
</html>
