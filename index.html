<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="googlebot" content="noindex,nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#14110f">
<title>후쿠오카 순례</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="app.css">
<script>
  try { var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<div id="map" aria-label="지도"></div>
<div id="flash" aria-hidden="true"></div>

<header id="hud">
  <div class="hud-row">
    <div id="chap" class="chap">CH.1</div>
    <div class="hud-text">
      <div id="dayTitle"></div>
      <div id="dayMeta"></div>
    </div>
    <div id="stamps" class="stamps" title="기도터 참배 도장"></div>
  </div>
  <div class="xp"><div id="xpFill" class="xp-fill"></div><span id="xpText" class="xp-text"></span></div>
</header>

<div id="banner" aria-hidden="true"><span class="b-tag">NEW QUEST</span><span id="bannerText"></span></div>
<div id="toast" role="status" aria-live="polite"></div>

<div id="fabs">
  <div class="col left">
    <button id="bWake" class="fab" aria-pressed="false" title="화면 꺼짐 방지"><span class="i">🔆</span><span class="t">화면 켜둠</span></button>
    <button id="bTheme" class="fab" title="다크 모드"><span class="i">🌙</span><span class="t">다크</span></button>
  </div>
  <div class="col right">
    <button id="bGpsOff" class="fab" title="GPS 켜기/끄기"><span class="i">📡</span><span class="t">GPS 켜기</span></button>
    <button id="bFollow" class="fab" aria-pressed="false" title="따라가기"><span class="i">🧭</span><span class="t">따라가기</span></button>
    <button id="bLocate" class="fab big" title="내 위치로 이동"><span class="i">◎</span><span class="t">내 위치</span></button>
  </div>
</div>

<section id="quest" aria-label="현재 퀘스트">
  <div class="q-inner">
    <div class="q-top"><span id="qType" class="q-type">QUEST</span><span id="qTimer" class="q-timer"></span></div>
    <div id="qTitle" class="q-title"></div>
    <ul id="qObjs" class="q-objs"></ul>
    <div id="qReward" class="q-reward"></div>
    <div id="qDist" class="q-dist"></div>
    <div id="qNext" class="q-next"></div>
    <div class="q-actions">
      <button id="qDetail" class="q-btn">📜 상세</button>
      <button id="qDone" class="q-btn primary">완료 ✓</button>
    </div>
  </div>
</section>

<nav id="dock" role="tablist"></nav>

<div id="scrim"></div>
<section id="sheet" aria-hidden="true">
  <div class="grab"></div>
  <div id="sheetBody"></div>
  <div class="sheetNav">
    <button id="sPrev">‹ 이전</button>
    <button id="sClose">닫기</button>
    <button id="sNext">다음 ›</button>
  </div>
</section>

<section id="menu" aria-hidden="true">
  <div class="grab"></div>
  <div class="m-tabs" role="tablist">
    <button data-tab="log" aria-selected="true">📜 퀘스트</button>
    <button data-tab="bag">🎒 가방</button>
    <button data-tab="shop">🛍 상점</button>
    <button data-tab="rule">🙏 예절</button>
    <button data-tab="money">💰 예산</button>
  </div>
  <div id="menuBody"></div>
  <div class="sheetNav one"><button id="mClose">닫기</button></div>
</section>

<div id="intro" aria-hidden="true">
  <div class="intro-card">
    <div id="introNum" class="intro-num"></div>
    <div id="introTitle" class="intro-title"></div>
    <div id="introSub" class="intro-sub"></div>
    <div class="intro-tap">화면을 눌러 시작</div>
  </div>
</div>
<div id="punch" aria-hidden="true"><div class="p-heart">❤</div><div id="punchText" class="p-text"></div></div>

<script src="vendor/leaflet.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js'); });
  }
</script>
</body>
</html>
